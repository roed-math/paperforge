# paperforge instance config. Copied into a new instance by `paper-init`.
# Paths are relative to the instance repo root unless absolute.

[paper]
title = "Title of the paper"
instance_name = "gq2"          # short slug; used for output filenames

[inputs]
# The AI-written LaTeX draft. Also serves as a plagiarism baseline (see below).
ai_draft = "inputs/draft/main.tex"
# The PRIMARY Lean formalization: a lake project root (may be absolute).
# Drives the axiom census, blueprint, and the default badge project.
lean_project = "/Users/roed/claude/gq2-lean"
# How <lean ref="X"> becomes a docs URL (doc-gen4 / Verso output). Sets the
# `lean.docs.base` XSL param in custom-html.xsl.
lean_docs_base = "https://roed.example/gq2-lean/docs/"

# Additional independent formalizations. Badges carry project= and get
# per-project colors (CSS class lean-proj-<name>); lean_links validates each
# project's refs against its own tree; build-web passes each declmap via
# --lean-map <name>=<declmap>. Mine the declmap with lean_declmap.py
# --cite-styles suited to that repo's citation discipline, --exclude for
# vendored trees, and cap badges via --lean-badge-cap when its proofs
# decompose statements into many declarations.
# [inputs.formalizations.other-model]
# root = "formalizations/other-model"
# module = "TheirModuleName"
# declmap = "crosswalk/lean-decl-map-other.json"

# Known historical snapshots of the paper (the draft is a moving target; the
# formalization may cite an older version's numbering). Each snapshot gets a
# numbering map under [crosswalk] dir.
# [snapshots.v1]
# description = "version the formalization tracked"
# tex = "path/to/old.tex"      # preferred: exact numbering via the simulator
# pdf = "path/to/old.pdf"      # fallback: recover statement numbers by title-match

[crosswalk]
# Stable-tag system: xml:ids are the canonical identity of every numbered item;
# printed numbers are presentation-specific (LaTeX global vs PreTeXt per-section
# vs old snapshots). See the numbering_drift validator and ingest/lean_ledger.py.
dir = "crosswalk/"
baseline = "v1"    # which snapshot the formalization's prose citations use

[style]
# Prior writing samples that define the author's voice (verbatim reference).
corpus = "style-corpus/"
# Free-text advice on mathematical writing, fed to every generative skill.
advice = "style-corpus/ADVICE.md"

[references]
pdf_dir = "references/"         # local copies of cited works (for the ref check)
bib     = "source/references.ptx"  # PreTeXt-native bibliography (converted)
# Alphabetic reference labels + author-name ordering (tex2ptx bib-labels option)
# labels = "references/bib-labels.json"

[notation]
# HTML hover affordance: a \notn use more than far_words after its definition
# is rewritten to \notnfar (visible dotted underline) by ingest/notation_far.py.
# Derived data — recompute after edits; never hand-write \notnfar.
far_words = 1500
near_hover_delay_ms = 200   # plain symbols (halved 2026-07-12 per author review)
far_hover_delay_ms = 500    # \notnfar-marked symbols
# Definition-site highlight: on hover, the defining occurrence flashes after
# this short delay (just enough to skip drive-by mouses).
defsite_highlight_delay_ms = 120

# Prose term links (background/terminology hovers): optional map for
# ingest/prose_terms.py; entries merge into the notation registry.
# prose_map = "notation/prose-map.json"

[detail]
default_level = 1              # PDF/default tier: render content with level <= this
max_level     = 3              # highest tier the HTML slider exposes

[plagiarism]
ngram     = 7      # flag verbatim spans of >= this many words
error_run = 12     # runs at least this long are errors (shorter: warnings)
# External sources only. The AI draft ([inputs] ai_draft) is NOT a flag-source:
# it is the provenance baseline (inherited-from-draft vs pipeline-added labels).
sources = ["references/"]

[build]
# FOLLOW-UP: the spike imports the core XSL by absolute path. Until the portable
# import is sorted, point this at the installed PreTeXt core for this machine.
pretext_core_xsl = "/Users/roed/.ptx/2.43.2/core/xsl/pretext-html.xsl"
# siblings, used by the latex targets (paper-init fills the xsl placeholders):
#   pretext-latex.xsl  and  pretext-latex-classic.xsl  in the same core dir
web_output   = "output/web"
print_output = "output/print"

# Sections deliberately running WITHOUT an <introduction> summary (a short
# section whose opening prose already is one): recorded waivers, read by the
# section_summaries validator.
# [validators.section_summaries]
# exempt = ["sec-example"]

# Trust-base table (ingest/trust_table.py): joins the axiom census with
# hand-authored row annotations and rewrites the marker block of the target
# insertion; --check is a drift gate (run by build-web and the
# artifact_drift validator). Omit the section to skip the step.
# [trust_table]
# project = "my-lean-project"           # <lean project="..."> on each row
# target = "content/insertions/NN-intro-formalization.ptx"
# annotations = "references/trust-annotations.json"
# census = "crosswalk/axiom-citations.json"

# ---- Project-site assembly (paperforge sitegen/ tools). Every block below
# is optional; each sitegen step skips quietly when its knobs are absent.

[site]
dir = "web-assets/site"        # hand-authored site tree (rsynced whole)
# pdf = "my-arxiv-preview.pdf" # site copy: output/site/paper.pdf

# Version footers + drift gate (sitegen/gen_status.py): a site status.json
# renders into every versions:begin/end marker block; extras are format
# strings over the status.json fields; checks tie hand-edited fields to the
# artifacts they duplicate (axiom_census counts status=="axiom" entries;
# line_count counts non-blank lines, ~ allowed).
# [site.status]
# extras = ["axiom census: {axiom_interfaces} interfaces"]
# tail_href = "reproducibility/"
# tail_label = "reproducibility"
# [site.status.checks.axiom_interfaces]
# axiom_census = "crosswalk/axiom-citations.json"

# Homepage background knowls (sitegen/gen_bg_knowls.py): first paragraphs
# of these clusters, extracted from the built paper into bg-knowls.js.
# Keep in sync with the homepage's anchors; the homepage script reads
# window.<prefix>_KNOWLS / _MACROS.
# [site.bg_knowls]
# clusters = ["bg-topic-one", "bg-topic-two"]
# js_global_prefix = "PF_BG"

# Site favicon (sitegen/gen_favicon.py): glyph outlines from MathJax's New
# Computer Modern font data on a rounded tile; sub is optional. Needs the
# npm font package under vendor/ and rsvg-convert for the rasters.
# [site.favicon]
# title = "Q_2"
# tile = "#1e5c3a"
# ink = "#ffffff"
# radius = 13         # corner radius on the 64-unit tile
# embolden = 26       # stroke added to the outlines, in em/1000
# main = { file = "dynamic/double-struck.js", code = 8474, advance = 777 }
# sub = { char = "2", scale = 0.78, kern = 20, drop = 125 }
