# paperforge instance config — the annotated catalogue of every knob.
#
# This file is REFERENCE, not a file to copy: `paperforge init` writes a
# minimal paper.toml with the handful of keys a new paper needs, and you
# add blocks from here as you turn features on. docs/CONFIGURATION.md is
# the same catalogue in table form, with defaults and deprecations.
#
# Paths are relative to the instance repo root unless absolute; `~`
# expands. Machine-local values (the PreTeXt core XSL) belong in the
# gitignored .paperforge.local.toml — committed files carry no machine
# paths.

[paperforge]
# The config/artifact-layout generation this instance is written against.
# Checked on every load; the compatibility gate for tool upgrades.
instance_schema = 1

[paper]
title = "Title of the paper"
slug = "mypaper"               # short identifier; used for output filenames
document_id = "mypaper"        # PreTeXt <document-id> (defaults to slug)

[inputs]
# The AI-written LaTeX draft: the canonical editable input, and the
# plagiarism baseline (see [plagiarism] below).
ai_draft = "inputs/draft/main.tex"

# ---- Formalizations. Omit the whole family for a paper with no Lean
# project: badges, the axiom census and the lean_links validator all skip.
#
# The PRIMARY formalization drives the axiom census, the blueprint, and the
# default badge project. `name` is the badge project key: it becomes the
# CSS class lean-proj-<name> and the /lean/<name>/ docs subset.
[formalizations.primary]
name = "mypaper-lean"
root = "../mypaper-lean"       # a lake project root (may be absolute)
# module = "MyPaper"           # top module dir inside root (census/docs subset)
# docs_root = "../lean/"       # deployed docs URL PREFIX (a URL, not a path)
declmap = "crosswalk/lean-decl-map.json"

# Additional INDEPENDENT formalizations (e.g. a second model's). Each gets
# its own badge color, its own docs subset, and is validated against its own
# tree. Mine its declmap with ingest/lean_declmap.py --cite-styles suited to
# that repo's citation discipline, --exclude for vendored trees, and cap
# badges with badge_cap when its proofs decompose one statement into many
# declarations.
# [formalizations.other-model]
# name = "other-model"
# root = "formalizations/other-model"
# module = "TheirModuleName"
# declmap = "crosswalk/lean-decl-map-other.json"
# badge_cap = 1

# Known historical snapshots of the paper (the draft is a moving target; the
# formalization may cite an older version's numbering). Each snapshot gets a
# numbering map under [crosswalk] dir.
# [snapshots.v1]
# description = "version the formalization tracked"
# tex = "path/to/old.tex"      # preferred: exact numbering via the simulator
# pdf = "path/to/old.pdf"      # fallback: recover statement numbers by title-match

[crosswalk]
# Stable-tag system: xml:ids are the canonical identity of every numbered item;
# printed numbers are presentation-specific (LaTeX global vs PreTeXt per-section
# vs old snapshots). See the numbering_drift validator and ingest/lean_ledger.py.
dir = "crosswalk/"
baseline = "v1"    # which snapshot the formalization's prose citations use

[ingest]
# Restyle \mathbf X -> \mathbb{X} for these letters (a common house
# convention difference between a draft and its published form).
mathbb_letters = ""
# The one numbering convention the simulator implements; it refuses others
# rather than guess. Verify against your draft's .aux before trusting it.
numbering_profile = "amsart-shared-section-theorems-global-equations"
# Author block: 'Name|Affiliation line|...' entries, plus '@draft' wherever
# the draft's own author block should be spliced in.
# authors = ["Jane Doe|Department|University", "@draft"]

# Structural draft macros expanded before parsing. Use this for macros whose
# expansion is a cross-reference or other structure the converter must see;
# the macro's own \newcommand is dropped from the emitted block.
# [[ingest.literal_rewrites]]
# from = "\\MyMacro"
# to = "\\cref{prop:target}"

[style]
# Prior writing samples that define the author's voice (verbatim reference).
corpus = "style-corpus/"
# Free-text advice on mathematical writing, fed to every generative skill.
advice = "style-corpus/ADVICE.md"

[references]
pdf_dir = "references/"         # local copies of cited works (for the ref check)
bib     = "source/references.ptx"  # PreTeXt-native bibliography (converted)
# Alphabetic reference labels + author-name ordering (tex2ptx bib-labels option)
labels = "references/bib-labels.json"

[notation]
# HTML hover affordance: a \notn use more than far_words after its definition
# is rewritten to \notnfar (visible dotted underline) by ingest/notation_far.py.
# Derived data — recompute after edits; never hand-write \notnfar.
far_words = 1500
near_hover_delay_ms = 200   # plain symbols
far_hover_delay_ms = 500    # \notnfar-marked symbols
# Definition-site highlight: on hover, the defining occurrence flashes after
# this short delay (just enough to skip drive-by mouses).
defsite_highlight_delay_ms = 120

# Prose term links (background/terminology hovers): optional map for
# ingest/prose_terms.py; entries merge into the notation registry.
# prose_map = "notation/prose-map.json"

[detail]
default_level = 1              # PDF/default tier: render content with level <= this
max_level     = 3              # highest tier the HTML slider exposes

[plagiarism]
ngram     = 7      # flag verbatim spans of >= this many words
error_run = 12     # runs at least this long are errors (shorter: warnings)
# External sources only. The AI draft ([inputs] ai_draft) is NOT a flag-source:
# it is the provenance baseline (inherited-from-draft vs pipeline-added labels).
sources = ["references/"]

[build]
web_output   = "output/web"
print_output = "output/print"
# The PreTeXt core XSL the conversions import is MACHINE-LOCAL: `paperforge
# init`/`doctor` discover it and write .paperforge.local.toml plus the
# gitignored xsl/core-local/ shims. Do not set pretext_core_xsl here.

# Literal replacements applied to the built HTML pages — for metadata the
# XSL cannot reach, e.g. Unicode for raw title math in <title>/OG tags.
# [[build.web_substitutions]]
# from = "\\mathbb{Q}_2"
# to = "ℚ₂"

# Sections deliberately running WITHOUT an <introduction> summary (a short
# section whose opening prose already is one): recorded waivers, read by the
# section_summaries validator.
# [validators.section_summaries]
# exempt = ["sec-example"]

# Trust-base table (ingest/trust_table.py): joins the axiom census with
# hand-authored row annotations and rewrites the marker block of the target
# insertion; --check is a drift gate (run by `paperforge build web` and the
# artifact_drift validator). Omit the section to skip the step.
# [trust_table]
# project = "mypaper-lean"              # <lean project="..."> on each row
# target = "content/insertions/NN-intro-formalization.ptx"
# annotations = "references/trust-annotations.json"
# census = "crosswalk/axiom-citations.json"

# ---- Project-site assembly (`paperforge build site`). Every block below
# is optional; each step skips quietly when its knobs are absent.

[site]
dir = "web-assets/site"        # hand-authored site tree (copied whole)
# pdf = "output/arxiv/main.pdf"  # source of the site's /paper.pdf

# Version footers + drift gate (sitegen/gen_status.py): a site status.json
# renders into every versions:begin/end marker block; extras are format
# strings over the status.json fields; checks tie hand-edited fields to the
# artifacts they duplicate (axiom_census counts status=="axiom" entries;
# line_count counts non-blank lines, ~ allowed).
# [site.status]
# extras = ["axiom census: {axiom_interfaces} interfaces"]
# tail_href = "reproducibility/"
# tail_label = "reproducibility"
# [site.status.checks.axiom_interfaces]
# axiom_census = "crosswalk/axiom-citations.json"

# Homepage background knowls (sitegen/gen_bg_knowls.py): first paragraphs
# of these clusters, extracted from the built paper into bg-knowls.js.
# Keep in sync with the homepage's anchors; the homepage script reads
# window.<prefix>_KNOWLS / _MACROS.
# [site.bg_knowls]
# clusters = ["bg-topic-one", "bg-topic-two"]
# js_global_prefix = "PF_BG"

# Statement knowls: whole elements (theorem articles, notation paragraphs)
# stitched in order, so the homepage can show a main theorem inline with the
# paragraphs defining its notation.  `expect` parallels `ids`: each substring
# must appear in its element's text, so a PreTeXt renumber that repoints an
# auto-numbered id fails the build instead of shipping the wrong paragraph.
# [[site.bg_knowls.statements]]
# key = "thm-main"
# title = "Theorem 1.2 (Main theorem)"
# href = "paper/paper.html#thm-main"
# ids = ["sec-intro-2-2", "thm-main"]
# expect = ["notation", "Main theorem"]

# Site favicon (sitegen/gen_favicon.py): glyph outlines from MathJax's New
# Computer Modern font data on a rounded tile; sub is optional. Needs the
# npm font package under vendor/ and rsvg-convert for the rasters.
# [site.favicon]
# title = "X"
# tile = "#1e5c3a"
# ink = "#ffffff"
# radius = 13         # corner radius on the 64-unit tile
# embolden = 26       # stroke added to the outlines, in em/1000
# main = { file = "dynamic/double-struck.js", code = 8474, advance = 777 }
# sub = { char = "2", scale = 0.78, kern = 20, drop = 125 }
